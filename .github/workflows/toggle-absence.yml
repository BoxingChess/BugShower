name: Toggle My Absence

on:
  workflow_dispatch:
    inputs:
      action:
        description: "부재 설정"
        required: true
        type: choice
        options:
          - "리뷰 불가능"
          - "리뷰 가능"

jobs:
  toggle-absence:
    name: Toggle Absence Status
    runs-on: ubuntu-latest
    steps:
      - name: Update REVIEWER_ABSENT_LIST
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          MY_USERNAME: ${{ github.actor }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          python3 - <<'EOF'
          import os
          import requests

          token    = os.environ["GH_PAT"]
          repo     = os.environ["REPO"]
          username = os.environ["MY_USERNAME"]
          action   = os.environ["ACTION"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          var_url = f"https://api.github.com/repos/{repo}/actions/variables/REVIEWER_ABSENT_LIST"

          # 현재 값 조회
          resp = requests.get(var_url, headers=headers)
          exists = resp.status_code == 200
          current = resp.json().get("value", "") if exists else ""
          absent_set = {r.strip() for r in current.split(",") if r.strip()}

          # 부재 목록 업데이트
          if action == "부재 시작":
              absent_set.add(username)
              msg = f"✅ @{username} 부재 등록 완료"
          else:
              absent_set.discard(username)
              msg = f"✅ @{username} 복귀 처리 완료"

          new_value = ",".join(sorted(absent_set))

          # 존재하면 PATCH, 없으면 POST
          if exists:
              r = requests.patch(var_url, headers=headers, json={"value": new_value})
          else:
              r = requests.post(
                  f"https://api.github.com/repos/{repo}/actions/variables",
                  headers=headers,
                  json={"name": "REVIEWER_ABSENT_LIST", "value": new_value},
              )

          r.raise_for_status()
          print(msg)
          print(f"현재 부재 목록: {new_value if new_value else '(없음)'}")
          EOF